# fly.toml app configuration file
app = 'twitch-que'
primary_region = 'ord'

[build]

[env]
  NODE_ENV = 'production'

[[mounts]]
  source = 'bot_data'
  destination = '/data'

# Health check service
[[services]]
  protocol = 'tcp'
  internal_port = 8080
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 8080
    handlers = ['http']

  [[services.http_checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'
    protocol = 'http'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
