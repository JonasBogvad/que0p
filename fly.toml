app = "twitch-que"
primary_region = "ord"

[build]

[env]
  NODE_ENV = "production"

# No HTTP service — this is a worker process, not a web server.
# But we expose a minimal health check port for Fly monitoring.
[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.http_checks]]
    interval = 30000
    grace_period = "10s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = 5000

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "bot_data"
  destination = "/data"
