<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>que0p — error</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/shared.css" />
    <style>
      h1 { font-size: 1.75rem; font-weight: 800; color: var(--red); margin-bottom: 0; }
      p { color: var(--muted); font-size: 0.85rem; line-height: 1.7; }
      .reason { color: var(--muted); margin-bottom: 0.5rem; }
      .twitch-link { color: var(--purple); }
    </style>
  </head>
  <body>
    <nav>
      <div class="nav-inner">
        <a href="/" class="nav-brand"><span class="dim">~/</span>que0p</a>
        <div class="nav-links">
          <a href="/channels.html" class="nav-link">channels</a>
          <a href="/add-channel" class="nav-btn">add-channel</a>
        </div>
      </div>
    </nav>

    <main class="page-main--narrow">
      <div class="prompt"><span class="bang">!</span> que0p --join-channel</div>
      <h1>✗ access denied</h1>
      <hr class="divider" />
      <p class="reason" id="reason"></p>
      <p>
        Whitelist only — ask
        <a href="https://twitch.tv/swisz" target="_blank" rel="noopener noreferrer" class="twitch-link">twitch.tv/swisz</a>
        to get approved.
      </p>
      <hr class="divider" />
      <a href="/" class="back-link">← back to que0p</a>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const reason = params.get('reason');
      const el = document.getElementById('reason');
      if (reason) el.textContent = reason;
      else el.remove();
    </script>
  </body>
</html>
