<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>que0p — joined</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/shared.css" />
    <style>
      h1 { font-size: 1.75rem; font-weight: 800; margin-bottom: 0; }
      .channel { color: var(--green); }
      p { color: var(--muted); font-size: 0.85rem; line-height: 1.7; }
      p strong { color: var(--fg); }
      p.mt { margin-top: 0.5rem; }
      .queue-link { color: var(--green); text-underline-offset: 4px; }
      .comment { color: var(--subtle); font-size: 0.75rem; margin-top: 0; }
    </style>
  </head>
  <body>
    <nav>
      <div class="nav-inner">
        <a href="/" class="nav-brand"><span class="dim">~/</span>que0p</a>
        <div class="nav-links">
          <a href="/channels.html" class="nav-link">channels</a>
          <a href="/faq.html" class="nav-link">faq</a>
          <a href="/add-channel" class="nav-btn">add-channel</a>
        </div>
      </div>
    </nav>

    <main class="page-main--narrow">
      <div class="prompt"><span class="dollar">$</span> que0p --join-channel</div>
      <h1>✓ bot joined <span class="channel" id="channel"></span></h1>
      <hr class="divider" />
      <p>Type <strong>!help</strong> in your chat to see all commands.</p>
      <p class="mt">The bot is live and ready to manage your queue.</p>
      <p class="mt">Watch your queue live at <a class="queue-link" id="queue-link" href="#"></a></p>
      <hr class="divider" />
      <p class="comment">// swisz: gl hf — don't go AFK or you'll lose your slot 👀</p>
      <hr class="divider" />
      <a href="/" class="back-link">← back to que0p</a>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const ch = params.get('channel');
      document.getElementById('channel').textContent = ch ? '#' + ch : '';
      if (ch) {
        const link = document.getElementById('queue-link');
        const url = `${location.origin}/queue.html?channel=${ch}`;
        link.href = url;
        link.textContent = url;
      }
    </script>
  </body>
</html>
