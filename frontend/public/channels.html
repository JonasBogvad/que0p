<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>que0p — channels</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/shared.css" />
    <style>
      h1 { font-size: 1.75rem; font-weight: 800; margin-bottom: 0.5rem; }
      .meta { color: var(--muted); font-size: 0.75rem; margin-bottom: 2.5rem; }

      .channel-list { border: 1px solid var(--border); overflow: hidden; }
      .channel-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem 1.25rem;
        border-bottom: 1px solid var(--border);
        text-decoration: none;
        color: inherit;
        transition: background 0.1s;
      }
      .channel-item:last-child { border-bottom: none; }
      .channel-item:hover,
      .channel-item:focus-visible { background: #0a0a0a; outline: none; }

      .channel-name { font-weight: 700; font-size: 0.9rem; }
      .channel-name .hash { color: var(--muted); }

      .channel-right { display: flex; align-items: center; gap: 1rem; }
      .channel-size { font-size: 0.75rem; color: var(--muted); }
      .arrow { color: var(--subtle); font-size: 0.75rem; transition: color 0.1s; }
      .channel-item:hover .arrow,
      .channel-item:focus-visible .arrow { color: var(--muted); }
    </style>
  </head>
  <body>
    <nav>
      <div class="nav-inner">
        <a href="/" class="nav-brand"><span class="dim">~/</span>que0p</a>
        <div class="nav-links">
          <a href="/faq.html" class="nav-link">faq</a>
          <a href="/add-channel" class="nav-btn">add-channel</a>
        </div>
      </div>
    </nav>

    <main class="page-main--mid">
      <div class="prompt"><span class="dollar">$</span> que0p --list-channels</div>
      <h1>channels</h1>
      <div class="meta" id="meta">loading...</div>

      <div id="container">
        <div class="empty-state">loading...</div>
      </div>

      <div class="page-footer">click a channel to view its live queue</div>
    </main>

    <script>
      async function load() {
        try {
          const res = await fetch('/api/channels');
          const data = await res.json();

          document.getElementById('meta').textContent =
            data.length === 0 ? 'no active channels' : `${data.length} active channel${data.length === 1 ? '' : 's'}`;

          const container = document.getElementById('container');
          if (data.length === 0) {
            container.innerHTML = '<div class="empty-state">no channels yet</div>';
            return;
          }

          container.innerHTML = '<div class="channel-list">' +
            data.map(ch =>
              `<a href="/queue.html?channel=${encodeURIComponent(ch.channel)}" class="channel-item">
                <span class="channel-name"><span class="hash">#</span>${escHtml(ch.channel)}</span>
                <span class="channel-right">
                  ${ch.size > 0 ? `<span class="channel-size">${ch.size} in queue</span>` : ''}
                  <span class="badge ${ch.open ? 'badge--open' : 'badge--closed'}">${ch.open ? 'open' : 'closed'}</span>
                  <span class="arrow">→</span>
                </span>
              </a>`
            ).join('') +
          '</div>';
        } catch {
          document.getElementById('meta').textContent = 'failed to load';
        }
      }

      function escHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }

      load();
    </script>
  </body>
</html>
