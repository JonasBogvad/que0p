<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>que0p — channels</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: #000;
        color: #fff;
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        min-height: 100vh;
      }

      nav {
        border-bottom: 1px solid #1a1a1a;
        padding: 1rem 1.5rem;
        position: sticky;
        top: 0;
        background: #000;
        z-index: 10;
      }
      nav .inner {
        max-width: 64rem;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      nav .brand { font-size: 0.875rem; font-weight: 700; letter-spacing: 0.1em; text-decoration: none; color: inherit; }
      nav .brand .dim { color: #999; }
      nav a.btn {
        font-family: inherit;
        font-size: 0.75rem;
        font-weight: 700;
        background: #fff;
        color: #000;
        border: none;
        padding: 0.4rem 0.85rem;
        cursor: pointer;
        text-decoration: none;
        letter-spacing: 0.03em;
      }
      nav a.btn:hover { background: #e5e5e5; }

      main {
        max-width: 48rem;
        margin: 0 auto;
        padding: 4rem 1.5rem;
      }

      .prompt { color: #888; font-size: 0.8rem; margin-bottom: 2.5rem; }
      .prompt .dollar { color: #4ade80; }

      h1 { font-size: 1.75rem; font-weight: 800; margin-bottom: 0.5rem; }
      .meta { color: #888; font-size: 0.75rem; margin-bottom: 2.5rem; }
      .divider { border: none; border-top: 1px solid #1a1a1a; margin: 2rem 0; }

      .channel-list { border: 1px solid #1a1a1a; overflow: hidden; }
      .channel-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem 1.25rem;
        border-bottom: 1px solid #1a1a1a;
        text-decoration: none;
        color: inherit;
        transition: background 0.1s;
      }
      .channel-item:last-child { border-bottom: none; }
      .channel-item:hover { background: #0a0a0a; }

      .channel-name { font-weight: 700; font-size: 0.9rem; }
      .channel-name .hash { color: #777; }

      .channel-right { display: flex; align-items: center; gap: 1rem; }
      .channel-size { font-size: 0.75rem; color: #777; }
      .badge {
        font-size: 0.65rem;
        font-weight: 700;
        padding: 0.15rem 0.45rem;
        border: 1px solid #333;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .badge.open { border-color: #4ade80; color: #4ade80; }

      .arrow { color: #333; font-size: 0.75rem; }
      .channel-item:hover .arrow { color: #999; }

      .empty { padding: 3rem 1.25rem; color: #333; font-size: 0.85rem; text-align: center; border: 1px solid #1a1a1a; }
      .footer { margin-top: 3rem; font-size: 0.7rem; color: #333; }
    </style>
  </head>
  <body>
    <nav>
      <div class="inner">
        <a href="/" class="brand"><span class="dim">~/</span>que0p</a>
        <a href="/add-channel" class="btn">add-channel</a>
      </div>
    </nav>

    <main>
      <div class="prompt"><span class="dollar">$</span> que0p --list-channels</div>
      <h1>channels</h1>
      <div class="meta" id="meta">loading...</div>

      <div id="container">
        <div class="empty">loading...</div>
      </div>

      <div class="footer">click a channel to view its live queue</div>
    </main>

    <script>
      async function load() {
        try {
          const res = await fetch('/api/channels');
          const data = await res.json();

          document.getElementById('meta').textContent =
            data.length === 0 ? 'no active channels' : `${data.length} active channel${data.length === 1 ? '' : 's'}`;

          const container = document.getElementById('container');
          if (data.length === 0) {
            container.innerHTML = '<div class="empty">no channels yet</div>';
            return;
          }

          container.innerHTML = '<div class="channel-list">' +
            data.map(ch =>
              `<a href="/queue.html?channel=${encodeURIComponent(ch.channel)}" class="channel-item">
                <span class="channel-name"><span class="hash">#</span>${escHtml(ch.channel)}</span>
                <span class="channel-right">
                  ${ch.size > 0 ? `<span class="channel-size">${ch.size} in queue</span>` : ''}
                  <span class="badge ${ch.open ? 'open' : ''}">${ch.open ? 'open' : 'closed'}</span>
                  <span class="arrow">→</span>
                </span>
              </a>`
            ).join('') +
          '</div>';
        } catch {
          document.getElementById('meta').textContent = 'failed to load';
        }
      }

      function escHtml(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }

      load();
    </script>
  </body>
</html>
