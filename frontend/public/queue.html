<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>que0p — queue</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: #000;
        color: #fff;
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        min-height: 100vh;
      }

      nav {
        border-bottom: 1px solid #1a1a1a;
        padding: 1rem 1.5rem;
        position: sticky;
        top: 0;
        background: #000;
        z-index: 10;
      }
      nav .inner {
        max-width: 80rem;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }
      nav .brand { font-size: 0.875rem; font-weight: 700; letter-spacing: 0.1em; text-decoration: none; color: inherit; }
      nav .brand .dim { color: #666; }
      nav .channel-title { font-size: 0.875rem; color: #888; }
      nav .channel-title strong { color: #fff; }
      .nav-status { font-size: 0.75rem; color: #555; }
      .nav-status.live { color: #4ade80; }

      main {
        max-width: 80rem;
        margin: 0 auto;
        padding: 2rem 1.5rem;
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 2rem;
        align-items: start;
      }

      @media (max-width: 700px) {
        main { grid-template-columns: 1fr; }
      }

      /* Queue panel */
      .panel-label {
        font-size: 0.7rem;
        color: #555;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 0.75rem;
      }

      .queue-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.5rem;
      }
      .queue-title { font-size: 1.5rem; font-weight: 800; }
      .badge {
        font-size: 0.65rem;
        font-weight: 700;
        padding: 0.2rem 0.5rem;
        border: 1px solid #333;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .badge.open { border-color: #4ade80; color: #4ade80; }

      .queue-meta { font-size: 0.75rem; color: #888; margin-bottom: 1.5rem; }

      /* Readyup banner */
      .readyup-banner {
        border: 1px solid #4ade80;
        padding: 1rem 1.25rem;
        margin-bottom: 1.5rem;
        display: none;
        animation: pulse-border 1.5s ease-in-out infinite;
      }
      .readyup-banner.visible { display: block; }
      @keyframes pulse-border {
        0%, 100% { border-color: #4ade80; }
        50% { border-color: #166534; }
      }
      .readyup-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.5rem;
      }
      .readyup-label { font-size: 0.65rem; color: #4ade80; text-transform: uppercase; letter-spacing: 0.1em; }
      .readyup-timer {
        font-size: 1.25rem;
        font-weight: 800;
        color: #4ade80;
        font-variant-numeric: tabular-nums;
      }
      .readyup-timer.urgent { color: #f87171; }
      .readyup-user { font-size: 1rem; font-weight: 700; }
      .readyup-pending { font-size: 0.75rem; color: #888; margin-top: 0.3rem; }

      /* Queue list */
      .queue-list { border: 1px solid #1a1a1a; overflow: hidden; }
      .queue-item {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.7rem 1.25rem;
        border-bottom: 1px solid #1a1a1a;
        font-size: 0.875rem;
        transition: background 0.4s ease;
      }
      .queue-item:last-child { border-bottom: none; }
      .queue-item.new { background: #0d1f0d; animation: fade-new 2s ease forwards; }
      @keyframes fade-new {
        0% { background: #0d2b0d; }
        100% { background: transparent; }
      }
      .queue-item .pos { color: #555; width: 2rem; text-align: right; flex-shrink: 0; font-size: 0.7rem; }
      .queue-item .pos.random { color: #555; }
      .queue-item .name { flex: 1; }
      .empty { padding: 2.5rem 1.25rem; color: #555; font-size: 0.85rem; text-align: center; border: 1px solid #1a1a1a; }

      /* Right panel */
      .right-panel { display: flex; flex-direction: column; gap: 1.5rem; }

      /* Activity log */
      .log-box {
        border: 1px solid #1a1a1a;
        overflow: hidden;
      }
      .log-header {
        padding: 0.6rem 1rem;
        border-bottom: 1px solid #1a1a1a;
        font-size: 0.65rem;
        color: #555;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .log-entries {
        padding: 0.75rem 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        min-height: 4rem;
      }
      .log-entry {
        font-size: 0.75rem;
        line-height: 1.4;
        animation: slide-in 0.2s ease;
      }
      @keyframes slide-in {
        from { opacity: 0; transform: translateY(-4px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .log-entry .log-prefix { color: #4ade80; }
      .log-entry .log-prefix.draw { color: #facc15; }
      .log-entry .log-prefix.ready { color: #60a5fa; }
      .log-entry .log-prefix.lost { color: #f87171; }
      .log-entry .log-prefix.close { color: #888; }
      .log-entry .log-text { color: #888; }
      .log-empty { font-size: 0.75rem; color: #333; padding: 0.5rem 0; }
    </style>
  </head>
  <body>
    <nav>
      <div class="inner">
        <a href="/" class="brand"><span class="dim">~/</span>que0p</a>
        <span class="channel-title" id="nav-channel"></span>
        <span class="nav-status" id="nav-status">● connecting...</span>
      </div>
    </nav>

    <main>
      <!-- Left: queue -->
      <div>
        <div class="queue-header">
          <h1 class="queue-title" id="channel-title">#</h1>
          <span class="badge" id="queue-badge">closed</span>
        </div>
        <div class="queue-meta" id="queue-meta">loading...</div>

        <div class="readyup-banner" id="readyup-banner">
          <div class="readyup-top">
            <span class="readyup-label">⚡ ready-up</span>
            <span class="readyup-timer" id="readyup-timer">30</span>
          </div>
          <div class="readyup-user" id="readyup-user"></div>
          <div class="readyup-pending" id="readyup-pending"></div>
        </div>

        <div id="queue-container">
          <div class="empty">loading...</div>
        </div>
      </div>

      <!-- Right: activity log -->
      <div class="right-panel">
        <div class="log-box">
          <div class="log-header">// activity log</div>
          <div class="log-entries" id="log-entries">
            <div class="log-empty">no activity yet</div>
          </div>
        </div>
      </div>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const channel = params.get('channel')?.toLowerCase();

      if (!channel) {
        document.querySelector('main').innerHTML = '<p style="color:#555;padding:4rem 0;grid-column:1/-1">No channel specified. Use <code>?channel=username</code></p>';
      } else {
        document.getElementById('nav-channel').innerHTML = `<strong>#${escHtml(channel)}</strong>`;
        document.getElementById('channel-title').textContent = '#' + channel;
        document.title = `que0p — #${channel}`;

        let prevPlayers = [];
        let prevOpen = null;
        let prevReadyupUser = null;
        let readyupStartTime = null;
        let countdownInterval = null;
        const logEntries = [];
        const MAX_LOG = 20;

        function addLog(prefix, prefixClass, text) {
          logEntries.unshift({ prefix, prefixClass, text, time: new Date() });
          if (logEntries.length > MAX_LOG) logEntries.pop();
          renderLog();
        }

        function renderLog() {
          const el = document.getElementById('log-entries');
          if (logEntries.length === 0) {
            el.innerHTML = '<div class="log-empty">no activity yet</div>';
            return;
          }
          el.innerHTML = logEntries.map(e =>
            `<div class="log-entry">
              <span class="log-prefix ${e.prefixClass}">&gt;</span>
              <span class="log-text"> ${escHtml(e.text)}</span>
            </div>`
          ).join('');
        }

        function startCountdown() {
          if (countdownInterval) clearInterval(countdownInterval);
          readyupStartTime = Date.now();
          countdownInterval = setInterval(() => {
            const elapsed = Math.floor((Date.now() - readyupStartTime) / 1000);
            const remaining = Math.max(0, 30 - elapsed);
            const timerEl = document.getElementById('readyup-timer');
            timerEl.textContent = remaining;
            timerEl.className = 'readyup-timer' + (remaining <= 10 ? ' urgent' : '');
          }, 250);
        }

        function stopCountdown() {
          if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
          readyupStartTime = null;
        }

        async function refresh() {
          try {
            const res = await fetch(`/api/queue/${channel}`);
            if (!res.ok) {
              document.getElementById('queue-meta').textContent = 'Channel not found or bot not active.';
              document.getElementById('nav-status').textContent = '● offline';
              document.getElementById('nav-status').className = 'nav-status';
              document.getElementById('queue-container').innerHTML = '<div class="empty">—</div>';
              return;
            }

            const data = await res.json();

            // Nav
            const navStatus = document.getElementById('nav-status');
            navStatus.textContent = '● live';
            navStatus.className = 'nav-status live';

            // Detect queue open/close events
            if (prevOpen !== null && prevOpen !== data.open) {
              if (data.open) {
                addLog('>', '', `queue opened (${data.mode === 'seq' ? 'sequential' : 'random'})`);
              } else {
                addLog('>', 'close', 'queue closed');
              }
            }
            prevOpen = data.open;

            // Badge
            const badge = document.getElementById('queue-badge');
            if (data.open) {
              badge.textContent = data.mode === 'seq' ? 'open · seq' : 'open · random';
              badge.className = 'badge open';
            } else {
              badge.textContent = 'closed';
              badge.className = 'badge';
            }

            // Meta
            document.getElementById('queue-meta').textContent =
              data.size === 0 ? 'queue is empty' : `${data.size} player${data.size === 1 ? '' : 's'} in queue`;

            // Detect new players
            const prevSet = new Set(prevPlayers);
            const newPlayers = data.players.filter(p => !prevSet.has(p));
            newPlayers.forEach(p => addLog('>', '', `${p} joined (#${data.players.indexOf(p) + 1})`));
            // Detect removed players (left, not drawn)
            const currSet = new Set(data.players);
            prevPlayers.filter(p => !currSet.has(p) && p !== prevReadyupUser).forEach(p => {
              // Only log as "left" if they weren't drawn (drawn players go to readyup)
              if (!data.readyup.current === p && !data.readyup.pending.includes(p)) {
                addLog('>', 'close', `${p} left the queue`);
              }
            });
            prevPlayers = [...data.players];

            // Ready-up
            const banner = document.getElementById('readyup-banner');
            if (data.readyup.waiting) {
              banner.className = 'readyup-banner visible';
              document.getElementById('readyup-user').textContent = '@' + data.readyup.current + ' — waiting for !ready';
              const pending = data.readyup.pending;
              document.getElementById('readyup-pending').textContent =
                pending.length > 0 ? `up next: ${pending.join(', ')}` : '';

              // New readyup player
              if (data.readyup.current !== prevReadyupUser) {
                addLog('>', 'draw', `${data.readyup.current} drawn — waiting for !ready`);
                startCountdown();
              }
              prevReadyupUser = data.readyup.current;
            } else {
              if (prevReadyupUser !== null) {
                stopCountdown();
                prevReadyupUser = null;
              }
              banner.className = 'readyup-banner';
            }

            // Queue list
            const container = document.getElementById('queue-container');
            const isRandom = data.mode === 'ran';
            if (data.players.length === 0) {
              container.innerHTML = '<div class="empty">no one in the queue yet</div>';
            } else {
              const existing = new Set(
                [...container.querySelectorAll('.queue-item')].map(el => el.dataset.name)
              );
              container.innerHTML = '<div class="queue-list">' +
                data.players.map((name, i) => {
                  const isNew = !existing.has(name) && existing.size > 0;
                  const posLabel = isRandom ? '~' : (i + 1);
                  return `<div class="queue-item${isNew ? ' new' : ''}" data-name="${escHtml(name)}">
                    <span class="pos${isRandom ? ' random' : ''}">${posLabel}</span>
                    <span class="name">${escHtml(name)}</span>
                  </div>`;
                }).join('') +
              '</div>';
            }

          } catch {
            document.getElementById('nav-status').textContent = '● offline';
            document.getElementById('nav-status').className = 'nav-status';
          }
        }

        function escHtml(s) {
          return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        refresh();
        setInterval(refresh, 3000);
      }
    </script>
  </body>
</html>
