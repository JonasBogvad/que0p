<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>que0p — queue</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/shared.css" />
    <style>
      /* Two-column layout */
      .queue-page {
        display: grid;
        grid-template-columns: 1fr 300px;
        gap: 2rem;
        align-items: start;
      }
      @media (max-width: 700px) { .queue-page { grid-template-columns: 1fr; } }

      /* Queue panel */
      .queue-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1rem;
      }
      .queue-title { font-size: 1.5rem; font-weight: 800; }
      .queue-meta { font-size: 0.75rem; color: var(--muted); margin-bottom: 1.5rem; }

      /* Ready-up banner */
      .readyup-banner {
        border: 1px solid var(--green);
        padding: 1rem 1.25rem;
        margin-bottom: 1.5rem;
        display: none;
        animation: pulse-border 1.5s ease-in-out infinite;
      }
      .readyup-banner.visible { display: block; }
      @keyframes pulse-border {
        0%, 100% { border-color: var(--green); }
        50%       { border-color: #166534; }
      }
      .readyup-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.5rem;
      }
      .readyup-label { font-size: 0.65rem; color: var(--green); text-transform: uppercase; letter-spacing: 0.1em; }
      .readyup-timer { font-size: 1.25rem; font-weight: 800; color: var(--green); font-variant-numeric: tabular-nums; }
      .readyup-timer.urgent { color: var(--red); }
      .readyup-user { font-size: 1rem; font-weight: 700; }
      .readyup-pending { font-size: 0.75rem; color: var(--muted); margin-top: 0.3rem; }

      /* Lobby */
      .lobby-box { border: 1px solid var(--border); overflow: hidden; margin-bottom: 1.5rem; }
      .lobby-header {
        padding: 0.6rem 1.25rem;
        border-bottom: 1px solid var(--border);
        font-size: 0.65rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        display: flex;
        justify-content: space-between;
      }
      .lobby-item {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.6rem 1.25rem;
        border-bottom: 1px solid var(--border);
        font-size: 0.875rem;
      }
      .lobby-item:last-child { border-bottom: none; }
      .lobby-dot { color: var(--green); font-size: 0.6rem; }

      /* Queue list */
      .queue-list { border: 1px solid var(--border); overflow: hidden; }
      .queue-item {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.7rem 1.25rem;
        border-bottom: 1px solid var(--border);
        font-size: 0.875rem;
      }
      .queue-item:last-child { border-bottom: none; }
      .queue-item.new { animation: fade-new 2s ease forwards; }
      @keyframes fade-new {
        0%   { background: #0d2b0d; }
        100% { background: transparent; }
      }
      .queue-pos          { color: var(--subtle); width: 2rem; text-align: right; flex-shrink: 0; font-size: 0.7rem; }
      .queue-pos--seq     { color: var(--green); opacity: 0.6; }
      .queue-pos--random  { color: var(--subtle); }

      /* Activity log */
      .log-box { border: 1px solid var(--border); overflow: hidden; }
      .log-header {
        padding: 0.6rem 1rem;
        border-bottom: 1px solid var(--border);
        font-size: 0.65rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .log-entries {
        padding: 0.75rem 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        min-height: 4rem;
      }
      .log-entry { font-size: 0.75rem; line-height: 1.4; animation: slide-in 0.2s ease; }
      @keyframes slide-in {
        from { opacity: 0; transform: translateY(-4px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .log-prefix        { color: var(--green); }
      .log-prefix--draw  { color: var(--yellow); }
      .log-prefix--ready { color: var(--blue); }
      .log-prefix--lost  { color: var(--red); }
      .log-prefix--close { color: var(--muted); }
      .log-text          { color: var(--muted); }
      .log-empty         { font-size: 0.75rem; color: var(--subtle); }

      /* Nav extras */
      .nav-channel { font-size: 0.875rem; color: var(--muted); font-weight: 700; }
      .nav-status { font-size: 0.75rem; color: var(--subtle); }
      .nav-status.live { color: var(--green); }

      /* No-channel fallback */
      .no-channel { color: var(--muted); padding: 4rem 0; grid-column: 1 / -1; }
    </style>
  </head>
  <body>
    <nav>
      <div class="nav-inner">
        <a href="/" class="nav-brand"><span class="dim">~/</span>que0p</a>
        <span class="nav-channel" id="nav-channel"></span>
        <div class="nav-links">
          <a href="/channels.html" class="nav-link">channels</a>
          <a href="/faq.html" class="nav-link">faq</a>
          <span class="nav-status" id="nav-status" role="status">● connecting...</span>
        </div>
      </div>
    </nav>

    <main class="page-main">
      <div class="queue-page" id="queue-page">
        <div class="no-channel">No channel specified. Use <code>?channel=username</code></div>
      </div>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const channel = params.get('channel')?.toLowerCase();

      if (channel) {
        document.getElementById('nav-channel').textContent = '#' + channel;
        document.title = `que0p — #${channel}`;

        document.getElementById('queue-page').innerHTML = `
          <div>
            <div class="queue-header">
              <h1 class="queue-title">#${escHtml(channel)}</h1>
              <span class="badge badge--closed" id="queue-badge">closed</span>
            </div>
            <div class="queue-meta" id="queue-meta">loading...</div>
            <div class="readyup-banner" id="readyup-banner" role="alert" aria-live="assertive">
              <div class="readyup-top">
                <span class="readyup-label">⚡ ready-up</span>
                <span class="readyup-timer" id="readyup-timer">30</span>
              </div>
              <div class="readyup-user" id="readyup-user"></div>
              <div class="readyup-pending" id="readyup-pending"></div>
            </div>
            <div id="queue-container"><div class="empty-state">loading...</div></div>
          </div>
          <div>
            <div id="lobby-container"></div>
            <div class="log-box">
              <div class="log-header">// activity log</div>
              <div class="log-entries" id="log-entries" role="log" aria-live="polite">
                <div class="log-empty">no activity yet</div>
              </div>
            </div>
          </div>
        `;

        let prevPlayers = [];
        let prevOpen = null;
        let prevReadyupUser = null;
        let prevLastEventLogin = null;
        let prevDrawnBatch = [];
        let readyupStartTime = null;
        let countdownInterval = null;
        const logEntries = [];
        const MAX_LOG = 20;

        function addLog(prefixClass, text) {
          logEntries.unshift({ prefixClass, text });
          if (logEntries.length > MAX_LOG) logEntries.pop();
          const el = document.getElementById('log-entries');
          el.innerHTML = logEntries.map(e =>
            `<div class="log-entry">
              <span class="log-prefix ${e.prefixClass ? 'log-prefix--' + e.prefixClass : ''}">&gt;</span>
              <span class="log-text"> ${escHtml(e.text)}</span>
            </div>`
          ).join('');
        }

        function startCountdown() {
          if (countdownInterval) clearInterval(countdownInterval);
          readyupStartTime = Date.now();
          countdownInterval = setInterval(() => {
            const remaining = Math.max(0, 30 - Math.floor((Date.now() - readyupStartTime) / 1000));
            const el = document.getElementById('readyup-timer');
            if (el) {
              el.textContent = remaining;
              el.className = 'readyup-timer' + (remaining <= 10 ? ' urgent' : '');
            }
          }, 250);
        }

        function stopCountdown() {
          if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
          readyupStartTime = null;
        }

        async function refresh() {
          try {
            const res = await fetch(`/api/queue/${channel}`);
            if (!res.ok) {
              document.getElementById('queue-meta').textContent = 'Channel not found or bot not active.';
              document.getElementById('nav-status').textContent = '● offline';
              document.getElementById('nav-status').className = 'nav-status';
              document.getElementById('queue-container').innerHTML = '<div class="empty-state">—</div>';
              return;
            }

            const data = await res.json();

            document.getElementById('nav-status').textContent = '● live';
            document.getElementById('nav-status').className = 'nav-status live';

            // Open/close events
            if (prevOpen !== null && prevOpen !== data.open) {
              addLog(data.open ? '' : 'close', data.open
                ? `queue opened (${data.mode === 'seq' ? 'sequential' : 'random'})`
                : 'queue closed');
            }
            prevOpen = data.open;

            // Badge
            const badge = document.getElementById('queue-badge');
            badge.textContent = data.open ? (data.mode === 'seq' ? 'open · seq' : 'open · random') : 'closed';
            badge.className = 'badge ' + (data.open ? 'badge--open' : 'badge--closed');

            // Meta
            document.getElementById('queue-meta').textContent =
              data.size === 0 ? 'queue is empty' : `${data.size} player${data.size === 1 ? '' : 's'} in queue`;

            // New / left players
            const prevSet = new Set(prevPlayers);
            const currSet = new Set(data.players);
            data.players.filter(p => !prevSet.has(p)).forEach(p =>
              addLog('', `${p} joined (#${data.players.indexOf(p) + 1})`)
            );
            prevPlayers.filter(p => !currSet.has(p) && p !== data.readyup?.current).forEach(p =>
              addLog('close', `${p} left the queue`)
            );
            prevPlayers = [...data.players];

            // Drawn batch — log once when a new batch starts
            const batch = data.readyup.drawnBatch || [];
            const batchKey = batch.join(',');
            const prevBatchKey = prevDrawnBatch.join(',');
            if (batch.length > 0 && batchKey !== prevBatchKey) {
              addLog('draw', `drew ${batch.length}: ${batch.join(', ')}`);
            }
            prevDrawnBatch = batch;

            // Ready-up
            const banner = document.getElementById('readyup-banner');
            // Log last readyup event if it changed
            const evt = data.readyup.lastEvent;
            if (evt?.login && evt.login !== prevLastEventLogin) {
              if (evt.type === 'ready') addLog('ready', `${evt.login} → lobby ⚡`);
              else if (evt.type === 'lost') addLog('lost', `${evt.login} — slot lost ⏰`);
              else if (evt.type === 'skip') addLog('close', `${evt.login} 💨 skipped`);
              prevLastEventLogin = evt.login;
            }

            if (data.readyup.waiting) {
              banner.className = 'readyup-banner visible';
              document.getElementById('readyup-user').textContent = '@' + data.readyup.current + ' — waiting for !ready';
              const pending = data.readyup.pending;
              document.getElementById('readyup-pending').textContent =
                pending.length > 0 ? `up next: ${pending.join(', ')}` : '';
              if (data.readyup.current !== prevReadyupUser) {
                startCountdown();
              }
              prevReadyupUser = data.readyup.current;
            } else {
              if (prevReadyupUser !== null) { stopCountdown(); prevReadyupUser = null; }
              banner.className = 'readyup-banner';
            }

            // Lobby
            const lobbyContainer = document.getElementById('lobby-container');
            if (data.lobby && data.lobby.length > 0) {
              lobbyContainer.innerHTML = `<div class="lobby-box">
                <div class="lobby-header">
                  <span>// lobby</span>
                  <span>${data.lobby.length} confirmed</span>
                </div>
                ${data.lobby.map(name =>
                  `<div class="lobby-item">
                    <span class="lobby-dot">●</span>
                    <span>${escHtml(name)}</span>
                  </div>`
                ).join('')}
              </div>`;
            } else {
              lobbyContainer.innerHTML = '';
            }

            // Queue list
            const container = document.getElementById('queue-container');
            const existing = new Set([...container.querySelectorAll('.queue-item')].map(el => el.dataset.name));
            if (data.players.length === 0) {
              container.innerHTML = '<div class="empty-state">no one in the queue yet</div>';
            } else {
              container.innerHTML = '<div class="queue-list">' +
                data.players.map((name, i) => {
                  const isNew = !existing.has(name) && existing.size > 0;
                  return `<div class="queue-item${isNew ? ' new' : ''}" data-name="${escHtml(name)}">
                    <span class="queue-pos ${data.mode === 'ran' ? 'queue-pos--random' : 'queue-pos--seq'}">${data.mode === 'ran' ? '~' : i + 1}</span>
                    <span>${escHtml(name)}</span>
                  </div>`;
                }).join('') +
              '</div>';
            }
          } catch {
            document.getElementById('nav-status').textContent = '● offline';
            document.getElementById('nav-status').className = 'nav-status';
          }
        }

        refresh();
        setInterval(refresh, 3000);
      }

      function escHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }
    </script>
  </body>
</html>
